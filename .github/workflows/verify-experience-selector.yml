name: Verify experience selector sizing

on:
  push:
    branches:
      - design/minimal-roblox-portfolio
    paths:
      - .github/workflows/verify-experience-selector.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/real-work.test.mjs
      - run: npm run build
