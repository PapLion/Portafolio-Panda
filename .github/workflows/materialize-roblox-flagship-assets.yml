name: Materialize Roblox flagship assets

on:
  push:
    branches:
      - feature/roblox-gamedev-route
    paths:
      - .github/workflows/materialize-roblox-flagship-assets.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roblox-gamedev-route

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download and optimize portfolio evidence
        env:
          SURRENDER_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/1bef5845-6f39-40b0-8154-56b0272571c4.png
          FPS_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/cd29bc99-7065-4a60-9f0a-6fdc773d7621.png
          RAGDOLL_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/f88917fd-2d77-487b-b283-7c1879a4aacf.png
          STUDIO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/ff96eb5c-bc83-42d0-8adb-08897e843e11.png
          PRODUCTION_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/3457a7ee-f668-4c92-97bc-3807e1f14e0c.png
          OPTICS_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3CJ9o2bzmH2r7k5ZVBPxdZFZIC4/5b289545-c57e-4f35-8232-da34d015e74b.png
        run: |
          python - <<'PY'
          import os
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          output = Path("public/images/roblox/flagship")
          output.mkdir(parents=True, exist_ok=True)

          assets = {
              "surrender-arrest.webp": os.environ["SURRENDER_URL"],
              "fps-combat.webp": os.environ["FPS_URL"],
              "ragdoll-weapon-drop.webp": os.environ["RAGDOLL_URL"],
              "studio-workflow.webp": os.environ["STUDIO_URL"],
              "npc-production-map.webp": os.environ["PRODUCTION_URL"],
              "weapon-optics-hud.webp": os.environ["OPTICS_URL"],
          }

          for filename, url in assets.items():
              request = Request(url, headers={"User-Agent": "portfolio-asset-materializer/1.0"})
              with urlopen(request, timeout=60) as response:
                  data = response.read()

              image = Image.open(BytesIO(data)).convert("RGB")
              if image.width > 1440:
                  height = round(image.height * 1440 / image.width)
                  image = image.resize((1440, height), Image.Resampling.LANCZOS)

              destination = output / filename
              image.save(destination, "WEBP", quality=82, method=6)
              print(f"{filename}: {image.width}x{image.height}, {destination.stat().st_size} bytes")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/roblox/flagship
          if git diff --cached --quiet; then
            echo "Assets already materialized."
            exit 0
          fi
          git commit -m "assets: add Roblox flagship evidence"
          git push origin HEAD:feature/roblox-gamedev-route
